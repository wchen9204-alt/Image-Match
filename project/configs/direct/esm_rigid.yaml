# ---------------------------------------------------------------------------
# ESM 刚体全局直接法配置
# ---------------------------------------------------------------------------
# 直接法类型；GLOBAL 表示估计整幅图共享的全局几何变换。
type: GLOBAL

# 直接法方法；ESM_RIGID 只估计旋转和平移，不引入尺度、仿射或单应自由度。
method: ESM_RIGID

params:
  # 每层金字塔最大迭代次数；默认值：50；值越大越稳但越慢。
  max_iterations: 50

  # 参数增量收敛阈值；默认值：1.0e-4；同时约束 theta、tx、ty 的本层增量。
  epsilon: 1.0e-4

  # 同步下采样图像金字塔层数，包含原图层；默认值：4；两张输入仍需同尺度，该项仅用于 coarse-to-fine 扩大收敛范围。
  pyramid_levels: 4

  # 灰度图预平滑核大小；默认值：5；小于 3 时不平滑，偶数会自动修正为奇数。
  blur_kernel: 5

  # 源图梯度幅值采样阈值；默认值：1.0e-3；提高该值可跳过更多低纹理像素。
  gradient_threshold: 1.0e-3

  # 全局 SSD 采样步长；默认值：2；值越小采样越密、计算越重。
  sample_step: 2
