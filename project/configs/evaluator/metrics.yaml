# ---------------------------------------------------------------------------
# 指标目录：声明 Evaluator 需要计算的评估指标。
# 当前先保留特征层和几何层指标，去掉旧的图像层评测指标。
# ---------------------------------------------------------------------------
metrics:
  # ----- 特征层指标 -----
  - name: REPEATABILITY
    enabled: true
    params:
      # 真值变换下判断关键点重复的像素距离阈值。
      pixel_threshold: 3.0

  # ----- 几何层指标 -----
  - name: INLIER_RATIO
    enabled: true
    params: {}

  - name: REPROJECTION_ERROR
    enabled: true
    params:
      # 是否计算对称重投影误差。
      symmetric: true
