# ---------------------------------------------------------------------------
# AKAZE 特征提取器配置
# 参数对应 cv::AKAZE::create(...)
# 注释中的“默认值”指 OpenCV 原始默认值
# ---------------------------------------------------------------------------
type: AKAZE

params:
  # 描述子类型：
  #   DESCRIPTOR_KAZE_UPRIGHT = 2
  #   DESCRIPTOR_KAZE         = 3
  #   DESCRIPTOR_MLDB_UPRIGHT = 4
  #   DESCRIPTOR_MLDB         = 5
  # 默认值: 5
  descriptor_type: 5
  # 描述子位数，0 表示使用完整长度，默认值: 0
  descriptor_size: 0
  # 描述子通道数，默认值: 3
  descriptor_channels: 3
  # 关键点响应阈值，默认值: 0.001
  threshold: 0.001
  # 最大 octave 数量，默认值: 4
  nOctaves: 4
  # 每个 octave 的子层数，默认值: 4
  nOctaveLayers: 4
  # 扩散类型，含义同 KAZE，默认值: 1
  diffusivity: 1

# AKAZE 默认使用 MLDB 二值描述子，匹配距离类型通常为 HAMMING
descriptor_norm: HAMMING
