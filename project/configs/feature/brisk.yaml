# ---------------------------------------------------------------------------
# BRISK 特征提取器配置
# 参数对应 cv::BRISK::create(thresh, octaves, patternScale)
# 注释中的“默认值”指 OpenCV 原始默认值
# ---------------------------------------------------------------------------
type: BRISK

params:
  # AGAST 角点检测阈值，默认值: 30
  thresh: 30
  # 尺度空间 octave 数量，默认值: 3
  octaves: 3
  # 描述子采样图样的缩放比例，默认值: 1.0
  patternScale: 1.0

# BRISK 使用二值描述子，匹配距离类型通常为 HAMMING
descriptor_norm: HAMMING
