# ---------------------------------------------------------------------------
# KAZE 特征提取器配置
# 参数对应 cv::KAZE::create(...)
# 注释中的“默认值”指 OpenCV 原始默认值
# ---------------------------------------------------------------------------
type: KAZE

params:
  # 是否输出扩展描述子，false 时为 64 维，true 时为 128 维，默认值: false
  extended: false
  # 是否使用 upright 描述子，true 时不具备旋转不变性，默认值: false
  upright: false
  # 关键点响应阈值，默认值: 0.001
  threshold: 0.001
  # 最大 octave 数量，默认值: 4
  nOctaves: 4
  # 每个 octave 的子层数，默认值: 4
  nOctaveLayers: 4
  # 扩散类型，DIFF_PM_G1 = 0, DIFF_PM_G2 = 1, DIFF_WEICKERT = 2, DIFF_CHARBONNIER = 3，默认值: 1
  diffusivity: 1

# KAZE 使用浮点描述子，匹配距离类型通常为 L2
descriptor_norm: L2
