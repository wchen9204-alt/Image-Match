# ---------------------------------------------------------------------------
# ORB 特征提取器配置
# 参数对应 cv::ORB::create(...)
# 注释中的“默认值”指 OpenCV 原始默认值
# ---------------------------------------------------------------------------
type: ORB

params:
  # 最多保留的特征点数量，默认值: 500
  nfeatures: 2000
  # 金字塔缩放比例，需大于 1，默认值: 1.2
  scaleFactor: 1.2
  # 金字塔层数，默认值: 8
  nlevels: 8
  # 图像边界内不检测特征的宽度，默认值: 31
  edgeThreshold: 31
  # 金字塔起始层，默认值: 0
  firstLevel: 0
  # 生成 BRIEF 描述子时每个元素使用的采样点数，默认值: 2
  WTA_K: 2
  # 评分方式，ORB::HARRIS_SCORE = 0，ORB::FAST_SCORE = 1，默认值: 0
  scoreType: 0
  # BRIEF 描述子使用的 patch 大小，默认值: 31
  patchSize: 31
  # FAST 关键点阈值，默认值: 20
  fastThreshold: 20

# ORB 使用二值描述子，匹配距离类型通常为 HAMMING
descriptor_norm: HAMMING
