# ---------------------------------------------------------------------------
# SIFT 特征提取器配置
# 参数对应 cv::SIFT::create(...)
# ---------------------------------------------------------------------------
type: SIFT

params:
  # 最多保留的特征数量；0 表示全部保留。
  nfeatures: 0
  # 每个 octave 的层数；OpenCV 推荐 3。
  nOctaveLayers: 3
  # 对比度阈值，用于过滤低对比度弱特征。
  contrastThreshold: 0.04
  # 边缘阈值，用于过滤边缘响应过强的特征。
  edgeThreshold: 10.0
  # 初始 octave 上输入图像的高斯 sigma。
  sigma: 1.6

# 当前特征提取器对应的匹配距离类型。
descriptor_norm: L2
