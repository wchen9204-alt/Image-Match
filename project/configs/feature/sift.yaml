# ---------------------------------------------------------------------------
# SIFT 特征提取器配置
# 参数对应 cv::SIFT::create(...)
# 注释中的“默认值”指 OpenCV 原始默认值
# ---------------------------------------------------------------------------
type: SIFT

params:
  # 最多保留的特征点数量，0 表示尽量保留全部，默认值: 0
  nfeatures: 0
  # 每个 octave 的层数，默认值: 3
  nOctaveLayers: 3
  # 对比度阈值，用于过滤低对比度弱特征，默认值: 0.04
  contrastThreshold: 0.04
  # 边缘阈值，用于过滤边缘响应过强的特征，默认值: 10.0
  edgeThreshold: 10.0
  # 输入图像初始高斯平滑的 sigma，默认值: 1.6
  sigma: 1.6

# SIFT 使用浮点描述子，匹配距离类型通常为 L2
descriptor_norm: L2
