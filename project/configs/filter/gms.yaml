# ---------------------------------------------------------------------------
# GMS 过滤器配置
# 参数对应 cv::xfeatures2d::matchGMS(...)
# 注释中的默认值指该函数签名中的默认参数
# ---------------------------------------------------------------------------
type: GMS

params:
  # 是否考虑图像间旋转，默认值: false
  withRotation: false
  # 是否考虑图像间尺度变化，默认值: false
  withScale: false
  # GMS 支持阈值因子，默认值: 6.0
  thresholdFactor: 6.0
