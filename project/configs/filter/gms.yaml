# ---------------------------------------------------------------------------
# GMS 过滤器配置
# 基于网格运动统计，参数对应 cv::xfeatures2d::matchGMS(...)。
# ---------------------------------------------------------------------------
type: GMS

params:
  # 两张图之间是否可能存在旋转。
  withRotation: false
  # 两张图之间是否可能存在尺度变化。
  withScale:    false
  # GMS 支持阈值。
  thresholdFactor: 6.0
