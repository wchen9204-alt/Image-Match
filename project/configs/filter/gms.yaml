# ---------------------------------------------------------------------------
# GMS 过滤器配置
# 参数对应 cv::xfeatures2d::matchGMS(...)
# GMS 按关键点的网格运动一致性过滤匹配，适合放在 MATCH 或 KNN top-1 之后。
# ---------------------------------------------------------------------------
type: GMS

params:
  # 是否考虑图像之间的旋转；默认 false。
  withRotation: false

  # 是否考虑图像之间的尺度变化；默认 false。
  withScale: false

  # GMS 阈值因子；OpenCV 默认 6.0，越大通常越严格。
  thresholdFactor: 6.0

  # GMS 若把匹配删到 0，是否回退到输入匹配；默认 true。
  # 做参数实验时可设为 false，用于观察 GMS 本身的严格过滤结果。
  fallbackToInputIfEmpty: true
