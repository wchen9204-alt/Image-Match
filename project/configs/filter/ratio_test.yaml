# ---------------------------------------------------------------------------
# Lowe 比值检验过滤器配置
# 这里的参数不属于 OpenCV 固定默认值，按常用经验和本项目默认值设置
# ---------------------------------------------------------------------------
type: RATIO_TEST

params:
  # 比值阈值：当 d1 / d2 < ratio 时保留 top-1 匹配
  # 常用经验值: 0.7 ~ 0.8
  # 本项目默认值: 0.75
  ratio: 0.85
