# ---------------------------------------------------------------------------
# 2D 仿射估计器配置
# 参数对应 cv::estimateAffine2D(...)
# ---------------------------------------------------------------------------
type: AFFINE

params:
  # 方法：RANSAC (8)、LMEDS (4)。
  method: RANSAC
  # 判定为内点的最大重投影误差，单位像素。
  ransacReprojThreshold: 3.0
  # 最大迭代次数。
  maxIters: 2000
  # 置信度。
  confidence: 0.99
  # 最少内点数量。
  minInliers: 6
  # 基于内点的细化迭代次数。
  refineIters: 10
