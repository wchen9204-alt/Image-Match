# ---------------------------------------------------------------------------
# 本质矩阵估计器配置
# 参数对应 cv::findEssentialMat(...)
# 需要相机内参；未提供 K 时使用 focal/pp 构造。
# ---------------------------------------------------------------------------
type: ESSENTIAL

params:
  # 方法：RANSAC (8)、LMEDS (4)。
  method: RANSAC
  # 归一化坐标下的最大重投影误差。
  threshold: 1.0
  # 置信度。
  prob: 0.999
  # 最少内点数量。
  minInliers: 8

# 相机内参；提供 3x3 K 时直接使用，否则由焦距和主点构造。
camera:
  # 可选 3x3 内参矩阵，按行存储；为空时使用 focal/pp。
  K: []
  # 焦距，单位像素。
  focal: 1000.0
  # 主点坐标 (px, py)。
  pp: [640.0, 360.0]
