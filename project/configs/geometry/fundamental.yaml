# ---------------------------------------------------------------------------
# 基础矩阵估计器配置
# 参数对应 cv::findFundamentalMat(...)
# ---------------------------------------------------------------------------
type: FUNDAMENTAL

params:
  # 方法：7POINT (1)、8POINT (2)、RANSAC (8)、LMEDS (4)。
  method: RANSAC
  # 点到极线的最大距离，单位像素。
  ransacReprojThreshold: 3.0
  # 置信度。
  confidence: 0.99
  # 最大迭代次数。
  maxIters: 2000
  # 最少内点数量。
  minInliers: 8
