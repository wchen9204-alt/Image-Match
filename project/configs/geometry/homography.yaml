# ---------------------------------------------------------------------------
# 单应矩阵估计器配置
# 参数对应 cv::findHomography(...)
# ---------------------------------------------------------------------------
type: HOMOGRAPHY

params:
  # 鲁棒估计方法；可选 RANSAC / LMEDS / RHO / USAC_MAGSAC；默认 RANSAC。
  # USAC_MAGSAC 对 HOMOGRAPHY 支持更明确，适合外点比例较高的点对。
  method: RANSAC

  # 内点重投影误差阈值，单位像素；OpenCV 默认 3.0。
  ransacReprojThreshold: 3.0

  # 最大迭代次数；OpenCV 默认 2000。
  maxIters: 2000

  # 置信度；OpenCV 默认 0.995。
  confidence: 0.995

  # 判定几何结果有效所需的最少内点数；项目默认 8。
  minInliers: 8
