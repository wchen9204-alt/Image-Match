# ---------------------------------------------------------------------------
# 单应矩阵估计器配置
# 参数对应 cv::findHomography(...)
# 注释中会区分 OpenCV 原始默认值和本项目默认值
# ---------------------------------------------------------------------------
type: HOMOGRAPHY

params:
  # 鲁棒估计方法，可选 RANSAC / LMEDS / RHO
  # OpenCV 原始默认值: 0（普通方法，不启用鲁棒估计）
  # 本项目默认值: RANSAC
  method: RANSAC
  # 最大允许重投影误差，单位像素，OpenCV 原始默认值: 3.0
  ransacReprojThreshold: 3.0
  # RANSAC 最大迭代次数，OpenCV 原始默认值: 2000
  maxIters: 2000
  # 置信度，范围 0..1，OpenCV 原始默认值: 0.995
  confidence: 0.995
  # 判定估计有效所需的最少内点数，本项目默认值: 8
  minInliers: 8
