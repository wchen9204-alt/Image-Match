# ---------------------------------------------------------------------------
# 单应矩阵估计器配置
# 参数对应 cv::findHomography(...)
# ---------------------------------------------------------------------------
type: HOMOGRAPHY

params:
  # 鲁棒方法：0（不使用）、RANSAC (8)、LMEDS (4)、RHO (16)。
  method: RANSAC
  # 最大允许重投影误差，单位像素。
  ransacReprojThreshold: 3.0
  # RANSAC 最大迭代次数。
  maxIters: 2000
  # 置信度，范围 0..1。
  confidence: 0.995
  # 有效估计所需的最少内点数量。
  minInliers: 8
