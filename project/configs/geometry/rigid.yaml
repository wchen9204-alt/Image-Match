# ---------------------------------------------------------------------------
# 2D 刚体变换几何估计器
#
# 当前实现先使用 OpenCV estimateAffinePartial2D 做 RANSAC 初筛。
# estimateAffinePartial2D 的模型是 partial affine / similarity：
#   x' = s*cos(theta)*x - s*sin(theta)*y + tx
#   y' = s*sin(theta)*x + s*cos(theta)*y + ty
# 它允许统一缩放 s，不允许剪切和各向异性缩放。
#
# OpenCV 的初始 partial affine 模型直接作为 baseline 使用。
# ---------------------------------------------------------------------------
type: RIGID

params:
  # 初始估计后端；可选 OPENCV_PARTIAL_AFFINE / CUSTOM_RIGID_RANSAC；默认 OPENCV_PARTIAL_AFFINE。
  #
  # OPENCV_PARTIAL_AFFINE:
  # - 先调用 estimateAffinePartial2D 做鲁棒初筛
  # - 直接使用 estimateAffinePartial2D 返回的 partial-affine 结果
  #
  # CUSTOM_RIGID_RANSAC:
  # - 直接在无缩放 rigid 模型下做项目内自定义 RANSAC
  # - 输出本身就是严格刚体
  # - 此时不使用 method 参数
  estimatorBackend: CUSTOM_RIGID_RANSAC

  # 鲁棒估计方法；可选 RANSAC / LMEDS；默认 RANSAC。
  # 仅在 estimatorBackend=OPENCV_PARTIAL_AFFINE 时生效。
  # 注意：OpenCV estimateAffinePartial2D 不支持 USAC_MAGSAC，若配置会自动回退 RANSAC。
  method: RANSAC

  # RANSAC 内点重投影误差阈值，单位像素；OpenCV 默认 5.0。
  ransacReprojThreshold: 5

  # RANSAC 最大迭代次数；参考刚体 RANSAC 默认 1000。
  maxIters: 1000

  # RANSAC 置信度；OpenCV 默认 0.99。
  confidence: 0.90

  # OpenCV partial affine 细化迭代次数；OpenCV 默认 10。
  refineIters: 10

  # 判定几何结果有效所需的最少内点数；默认 2。
  minInliers: 2

  # 是否从 filtered_matches 额外抽取严格 rigid 候选；默认 true。
  # 开启且候选前置条件满足时始终执行，不受 baseline 是否成功影响。
  enableFilteredMatchCandidates: true

  # 候选 seed 的描述子距离池大小，默认 64。
  # 先从全部 filtered 匹配中取前 poolSize 个描述子距离较小的匹配，作为后续混合选点范围。
  filteredMatchCandidatePoolSize: 64

  # 最终用于两点组合的候选 seed 数量上限，默认 24。
  # 从上述距离池中混合做“空间分散选点 + 距离优先补点 + 主旋转峰补点”后得到。
  filteredMatchCandidateTopK: 24

  # 额外 rigid 候选的两点组合调度策略；可选 COVERAGE_FIRST / LEGACY_LEXICOGRAPHIC，默认 COVERAGE_FIRST。
  # COVERAGE_FIRST 按成功建模的 seed 使用次数优先覆盖未使用 seed，再比较描述子质量和两图空间间距。
  # LEGACY_LEXICOGRAPHIC 按 seed 的 i/j 嵌套顺序尝试。
  filteredMatchCandidatePairStrategy: LEGACY_LEXICOGRAPHIC

  # 最多生成多少个额外候选模型，默认 12 个。
  filteredMatchCandidateCount: 12

  # 生成候选时，两点之间最小空间间距，避免退化样本，默认20.0。
  filteredMatchCandidateMinPairDistance: 20.0

  # 是否在多候选 rigid 选模时加入前景 mask 几何评分。
  # 开启后，每个候选都会额外计算局部包含率；选模仍以内点数优先。
  enableCandidateMaskScoring: true
  # 选模顺序固定为：内点数最多 -> 平均重投影误差最小 -> containment 平局。

  # 多层暗部 fallback 的投票与严格刚体 RANSAC 参数；普通 rigid 后端不读取此节点。
  multilayer_dark:
    min_inliers: 6
    rotation_bin_degrees: 5.0
    translation_bin_size: 10.0
    reprojection_threshold: 3.0
    ransac_iterations: 1000
    max_clusters: 5

  # 候选 mask 评分使用的前景二值化阈值。
  candidateMaskForegroundThreshold: 10

  # 轻量候选去重时允许的最大旋转角差，默认2.0，单位为度。
  # 若两个 rigid 候选的旋转差和平移差都很小，则视为重复候选。
  candidateDedupRotationDiffDeg: 2.0

  # 轻量候选去重时允许的最大平移差，默认3.0，单位为像素。
  candidateDedupTranslationDiff: 3.0
