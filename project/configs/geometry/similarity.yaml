# ---------------------------------------------------------------------------
# 2D 相似变换估计器配置
# 参数对应 cv::estimateAffinePartial2D(...)
# ---------------------------------------------------------------------------
type: SIMILARITY

params:
  # 鲁棒估计方法；可选 RANSAC / LMEDS；默认 RANSAC。
  # 注意：OpenCV estimateAffinePartial2D 不支持 USAC_MAGSAC，若配置会自动回退 RANSAC。
  method: RANSAC

  # 内点重投影误差阈值，单位像素；OpenCV 默认 3.0。
  ransacReprojThreshold: 3.0

  # 最大迭代次数；OpenCV 默认 2000。
  maxIters: 2000

  # 置信度；OpenCV 默认 0.99。
  confidence: 0.99

  # 判定几何结果有效所需的最少内点数；项目默认 3。
  minInliers: 3

  # 基于内点的细化迭代次数；OpenCV 默认 10。
  refineIters: 10
