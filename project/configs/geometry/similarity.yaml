# ---------------------------------------------------------------------------
# 2D 相似变换估计器配置
# 参数对应 cv::estimateAffinePartial2D(...)
# 注释中会区分 OpenCV 原始默认值和本项目默认值
# ---------------------------------------------------------------------------
type: SIMILARITY

params:
  # 鲁棒估计方法，可选 RANSAC / LMEDS
  # OpenCV 原始默认值: RANSAC
  # 本项目默认值: RANSAC
  method: RANSAC
  # 判定内点的最大重投影误差，单位像素，OpenCV 原始默认值: 3.0
  ransacReprojThreshold: 3.0
  # 最大迭代次数，OpenCV 原始默认值: 2000
  maxIters: 2000
  # 置信度，OpenCV 原始默认值: 0.99
  confidence: 0.99
  # 判定估计有效所需的最少内点数，本项目默认值: 3
  minInliers: 3
  # 基于内点的细化迭代次数，OpenCV 原始默认值: 10
  refineIters: 10
