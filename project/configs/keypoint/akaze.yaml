# ---------------------------------------------------------------------------
# AKAZE 关键点与描述子配置
# 参数对应 cv::AKAZE::create(...)
# 注释中的“默认值”指 OpenCV 构造器的默认参数
# ---------------------------------------------------------------------------
type: AKAZE

params:
  # 默认值：5。描述子类型。
  # 可选：
  #   2 = DESCRIPTOR_KAZE_UPRIGHT
  #   3 = DESCRIPTOR_KAZE
  #   4 = DESCRIPTOR_MLDB_UPRIGHT
  #   5 = DESCRIPTOR_MLDB
  descriptor_type: 5

  # 默认值：0。描述子位数；0 表示使用该类型的完整默认长度。
  descriptor_size: 0

  # 默认值：3。描述子通道数。
  descriptor_channels: 3

  # 默认值：0.001。关键点响应阈值；越小通常检测到的点越多。
  threshold: 0.0001

  # 默认值：4。尺度空间 octave 数量。
  nOctaves: 4

  # 默认值：4。每个 octave 内的层数。
  nOctaveLayers: 4

  # 默认值：1。扩散类型。
  # 可选：
  #   0 = DIFF_PM_G1
  #   1 = DIFF_PM_G2
  #   2 = DIFF_WEICKERT
  #   3 = DIFF_CHARBONNIER
  diffusivity: 1

# AKAZE 默认常用 MLDB 二值描述子，匹配距离通常使用 HAMMING。
# 仅当 matcher 的 norm_type 为 AUTO 时生效；matcher 显式 norm_type 优先级更高。
descriptor_norm: HAMMING

augmentation:
  # AKAZE 的 OpenCV 描述子依赖检测器内部尺度空间 class_id。
  # 当前即使设为 true，运行时也会安全跳过边界角点增强，避免 compute 崩溃。
  foreground_boundary_corners:
    enabled: true
    # 边界角点检测方法。
    # 可选：shi_tomasi / harris
    corner_method: harris
    max_corners: 40
    quality_level: 0.01
    min_distance: 8.0
    block_size: 3
    harris_k: 0.04
    boundary_band: 6
    foreground_threshold: 10
    keypoint_size: 12.0
    max_total_keypoints: -1
