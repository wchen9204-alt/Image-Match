# ---------------------------------------------------------------------------
# BRISK 关键点与描述子配置
# 参数对应 cv::BRISK::create(thresh, octaves, patternScale)
# 注释中的“默认值”指 OpenCV 构造器的默认参数
# ---------------------------------------------------------------------------
type: BRISK

params:
  # 默认值：30。AGAST 角点检测阈值。
  thresh: 30

  # 默认值：3。尺度空间 octave 数量。
  octaves: 3

  # 默认值：1.0。描述子采样图样的缩放比例。
  patternScale: 1.0

# BRISK 使用二值描述子，匹配距离通常使用 HAMMING。
# 仅当 matcher 的 norm_type 为 AUTO 时生效；matcher 显式 norm_type 优先级更高。
descriptor_norm: HAMMING

augmentation:
  foreground_boundary_corners:
    enabled: true
    # 边界角点检测方法。
    # 可选：shi_tomasi / harris
    corner_method: harris
    max_corners: 40
    quality_level: 0.01
    min_distance: 8.0
    block_size: 3
    harris_k: 0.04
    boundary_band: 6
    foreground_threshold: 10
    keypoint_size: 12.0
    max_total_keypoints: -1
