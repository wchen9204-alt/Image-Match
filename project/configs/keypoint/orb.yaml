# ---------------------------------------------------------------------------
# ORB 关键点与描述子配置
# 参数对应 cv::ORB::create(...)
# 注释中的“默认值”指 OpenCV 构造器的默认参数
# ---------------------------------------------------------------------------
type: ORB

params:
  # 默认值：500。最多保留的关键点数量。
  nfeatures: 2000

  # 默认值：1.2。金字塔层间缩放比例，必须大于 1。
  scaleFactor: 1.2

  # 默认值：8。金字塔层数。
  nlevels: 8

  # 默认值：31。边界宽度；靠近边界的区域不检测关键点。
  edgeThreshold: 31

  # 默认值：0。起始金字塔层编号。
  firstLevel: 0

  # 默认值：2。生成 BRIEF 描述子时每个元素参与比较的点数。
  WTA_K: 2

  # 默认值：0。评分方式。
  # 可选：
  #   0 = ORB::HARRIS_SCORE
  #   1 = ORB::FAST_SCORE
  scoreType: 0

  # 默认值：31。BRIEF 描述子使用的 patch 大小。
  patchSize: 31

  # 默认值：20。FAST 角点阈值。
  fastThreshold: 20

# ORB 使用二值描述子，匹配距离通常使用 HAMMING。
# 仅当 matcher 的 norm_type 为 AUTO 时生效；matcher 显式 norm_type 优先级更高。
descriptor_norm: HAMMING

augmentation:
  foreground_boundary_corners:
    enabled: true
    # 边界角点检测方法。
    # 可选：shi_tomasi / harris
    corner_method: harris
    max_corners: 40
    quality_level: 0.01
    min_distance: 8.0
    block_size: 3
    harris_k: 0.04
    boundary_band: 6
    foreground_threshold: 10
    keypoint_size: 12.0
    max_total_keypoints: -1
