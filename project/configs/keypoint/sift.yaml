# ---------------------------------------------------------------------------
# SIFT 关键点与描述子配置
# 参数对应 cv::SIFT::create(...)
# 注释中的“默认值”指 OpenCV 构造器的默认参数
# ---------------------------------------------------------------------------
type: SIFT

params:
  # 默认值：0。最多保留的关键点数量；0 表示尽量保留全部。
  nfeatures: 0

  # 默认值：3。每个 octave 内的层数。
  nOctaveLayers: 3

  # 默认值：0.04。对比度阈值；用于过滤低对比度弱特征。
  contrastThreshold: 0.04

  # 默认值：10.0。边缘阈值；用于过滤边缘响应过强的特征。
  edgeThreshold: 10.0

  # 默认值：1.6。输入图像初始高斯平滑的 sigma。
  sigma: 1.6

# SIFT 使用浮点描述子，匹配距离通常使用 L2。
# 仅当 matcher 的 norm_type 为 AUTO 时生效；matcher 显式 norm_type 优先级更高。
descriptor_norm: L2
