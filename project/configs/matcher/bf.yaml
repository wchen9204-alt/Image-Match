# ---------------------------------------------------------------------------
# BF matcher config
# type selects the brute-force matcher, method selects the OpenCV API:
#   - match
#   - knn
#   - radius
# ---------------------------------------------------------------------------
type: BF

params:
  # MATCH / KNN / RADIUS
  method: knn

  # L2 / L1 / HAMMING / HAMMING2 / AUTO
  norm_type: AUTO

  # Used when method: knn
  knn_k: 2

  # Used when method: radius
  radius: 100.0

  # Only applies when method: match
  crossCheck: true
