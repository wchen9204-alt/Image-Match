# ---------------------------------------------------------------------------
# BF 匹配器配置
# 通过 `type` 选择暴力匹配器，通过 `method` 选择具体 OpenCV 接口：
#   - match
#   - knn
#   - radius
# ---------------------------------------------------------------------------
type: BF

params:
  # MATCH / KNN / RADIUS
  method: knn

  # L2 / L1 / HAMMING / HAMMING2 / AUTO
  norm_type: AUTO

  # 当 method: knn 时使用，默认2
  knn_k: 2

  # 当 method: radius 时使用，默认100.0
  radius: 100.0

  # 仅在 method: match 时生效
  crossCheck: true
