# ---------------------------------------------------------------------------
# FLANN 匹配器配置
# 通过 `type` 选择 FLANN 匹配器，通过 `method` 选择具体 OpenCV 接口：
#   - match
#   - knn
#   - radius
# 浮点描述子使用 KDTree，二进制描述子使用 LSH。
# ---------------------------------------------------------------------------
type: FLANN

params:
  # MATCH / KNN / RADIUS，默认 knn
  method: match
  # L2 / L1 / HAMMING / HAMMING2 / AUTO
  # 优先级：matcher 显式 norm_type 最高；AUTO 时使用 keypoint 的 descriptor_norm。
  # 若两者都是 AUTO/UNKNOWN，则按描述子矩阵类型兜底推断。
  norm_type: AUTO

  # 当 method: knn 时使用，默认 2
  knn_k: 2

  # 当 method: radius 时使用，默认 100.0
  radius: 100.0

  kdtree:
    # KDTree 树数量，默认 5
    trees: 5

  lsh:
    # LSH 哈希表数量，默认 12
    table_number: 12
    # LSH key 大小，默认 20
    key_size: 20
    # LSH 多探测层级，默认 2
    multi_probe_level: 2

  search:
    # 搜索检查次数，默认 50
    checks: 50
    # 搜索 eps 参数，默认 0.0
    eps: 0.0
    # 是否按距离排序返回，默认 true
    sorted: true
