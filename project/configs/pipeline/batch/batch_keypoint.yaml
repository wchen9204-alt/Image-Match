# ---------------------------------------------------------------------------
# 批处理任务配置
# 当前文件定义批量样本的流水线入口、数据集位置和输出策略
# ---------------------------------------------------------------------------
name: batch_pipeline

pipeline: ../keypoint/akaze_pipeline.yaml

dataset:
  root: ../../../datasets/
  # source 图像文件名关键词候选；DatasetLoader 按顺序寻找源图。
  pattern_sources: [source, moving]
  # target 图像文件名关键词候选；DatasetLoader 按顺序寻找目标图。
  pattern_targets: [target, reference]
  include: []

output:
  root: ../../../tmp/
  save_visuals: true
  summary_csv: true

# 批处理自身的可视化设置；不继承 keypoint pipeline YAML。
visualization:
  # 图片总开关在 output.save_visuals；这里控制各类图片。
  draw_keypoints: true
  draw_matches: true
  # 点特征匹配图层级；可选 RAW / FILTERED / INLIERS。
  match_views: [RAW, FILTERED, INLIERS]
  max_matches_drawn: 100
  save_originals: true
  save_warped: true
  save_blend: true
  save_false_color_overlay: true
