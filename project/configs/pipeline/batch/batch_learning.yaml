# ---------------------------------------------------------------------------
# 深度学习方法批处理任务配置
# 当前文件定义批量样本的 learning pipeline 入口、数据集位置和输出策略。
# ---------------------------------------------------------------------------
# 批处理名称；默认值：当前 YAML 文件名 stem；主要用于日志和配置识别。
name: batch_learning

# 单样本 pipeline 入口；默认值：空，批处理必须显式指定。
# 可选示例：
#   ../learning/loftr_learning_pipeline.yaml
#   ../learning/superpoint_lightglue_learning_pipeline.yaml
#   ../learning/superpoint_superglue_learning_pipeline.yaml
# 具体学习模型由对应 pipeline 中的 learning 字段决定。
pipeline: ../learning/superpoint_superglue_learning_pipeline.yaml

dataset:
  # 数据集根目录；默认值：空，批处理必须显式指定。
  root: ../../../datasets

  # source 图像文件名关键词候选；默认值：[source, moving]；DatasetLoader 按顺序寻找源图。
  pattern_sources: [source, moving]

  # target 图像文件名关键词候选；默认值：[target, reference]；DatasetLoader 按顺序寻找目标图。
  pattern_targets: [target, reference]

  # 样本白名单；默认值：空列表，表示包含全部样本；填写样本目录名可只跑指定样本。
  include: []

output:
  # 输出根目录；默认值：../../outputs；实际输出会追加 batch/learning/<pipeline>/<sample> 层级。
  root: ../../../outputs

  # 是否保存全部 PNG 可视化；默认值：true；false 时跳过编码和写盘，算法与验证仍会执行。
  save_visuals: true

  # 是否保存批处理汇总 CSV；默认值：true；文件写到 batch/learning/<pipeline>/summary.csv。
  summary_csv: true

# 批处理自身的可视化设置；不继承 learning pipeline YAML。
visualization:
  # false 图前景阈值；仅影响可视化。0 表示显示所有非黑像素。
  false_color_foreground_threshold: 0
  # 是否保存 source/target 原图前景 mask，以及 warped source/target 前景重叠图。
  save_foreground_masks: true
  draw_keypoints: false
  draw_matches: true
  # 学习匹配图层级；可选 RAW / FILTERED / INLIERS。
  match_views: [RAW, INLIERS]
  max_matches_drawn: 200
  save_originals: true
  save_warped: true
  save_blend: true
  save_false_color_overlay: true
