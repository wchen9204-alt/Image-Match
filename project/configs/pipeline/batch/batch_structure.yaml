# ---------------------------------------------------------------------------
# 批处理任务配置
# 当前文件定义批量样本的流水线入口、数据集位置和输出策略
# ---------------------------------------------------------------------------
name: batch_pipeline

# pipeline 默认值：无固定默认，必须显式指定
pipeline: ../structure/contour_pipeline.yaml

dataset:
  # root 默认值：无固定默认，必须显式指定
  root: ../../../datasets
  # source 图像文件名关键词候选；DatasetLoader 按顺序寻找源图。
  pattern_sources: [source, moving]
  # target 图像文件名关键词候选；DatasetLoader 按顺序寻找目标图。
  pattern_targets: [target, reference]
  # include 默认值：空列表，表示包含全部样本
  include: []

output:
  # root 默认值：无固定默认，通常应显式指定
  root: ../../../outputs
  # save_visuals / summary_csv 默认值：由批处理逻辑按当前配置文件显式给出
  save_visuals: true
  summary_csv: true

# 批处理自身的可视化设置；不继承 structure pipeline YAML。
visualization:
  draw_keypoints: false
  draw_matches: true
  # 结构匹配图使用的对应关系；可选 RAW / INLIERS。
  structure_match_source: INLIERS
  max_matches_drawn: 100
  save_structure_responses: true
  save_originals: true
  save_warped: true
  save_blend: true
  save_false_color_overlay: true
