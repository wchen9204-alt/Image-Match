# ---------------------------------------------------------------------------
# 直接法对比配置：同时遍历四类 direct pipeline 下的小方法，批量跑完输出总表
# ---------------------------------------------------------------------------
name: compare_direct_methods

# 默认模板；组合项可以用 pipeline 字段覆盖到 global/frequency/sparse/dense。
base_pipeline: ../direct/dense_direct_pipeline.yaml

# direct 对比任务统一使用的点特征初始化器；修改此处即可切换六种直接法的初值。
feature_initializer:
  name: KAZE
  keypoint: ../../keypoint/kaze.yaml

# 待对比的直接法小方法。
# pipeline 决定使用哪一类直接法公共参数，direct 决定具体算法配置。
combinations:
  - label: global_ecc
    pipeline: ../direct/global_direct_pipeline.yaml
    direct: ../../direct/ecc.yaml
  - label: global_esm_rigid
    pipeline: ../direct/global_direct_pipeline.yaml
    direct: ../../direct/esm_rigid.yaml
  - label: frequency_fourier_mellin
    pipeline: ../direct/frequency_direct_pipeline.yaml
    direct: ../../direct/fourier_mellin.yaml
  - label: sparse_klt_sparse
    pipeline: ../direct/sparse_direct_pipeline.yaml
    direct: ../../direct/klt_sparse.yaml
  - label: dense_dis_flow
    pipeline: ../direct/dense_direct_pipeline.yaml
    direct: ../../direct/dis_flow.yaml
  - label: dense_farneback
    pipeline: ../direct/dense_direct_pipeline.yaml
    direct: ../../direct/farneback.yaml

dataset:
  root: ../../../datasets
  pattern_sources: [source, moving]
  pattern_targets: [target, reference]
  include: []

output:
  root: ../../../outputs/compare/direct
  # 是否保存当前 compare 任务下的全部图片输出；恢复为 true 后，继续按下方 visualization 的分类开关落盘。
  save_visuals: true
  summary_csv: true

# 批处理自身的可视化设置；不继承 direct pipeline YAML。
visualization:
  # false 图前景阈值；仅影响可视化。0 表示显示所有非黑像素。
  false_color_foreground_threshold: 0
  # 是否保存 source/target 原图前景 mask，以及 warped source/target 前景重叠图。
  save_foreground_masks: true
  draw_keypoints: false
  draw_matches: false
  match_views: []
  save_originals: true
  save_warped: true
  save_blend: true
  save_false_color_overlay: true
