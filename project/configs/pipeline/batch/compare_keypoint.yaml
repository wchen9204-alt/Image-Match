# ---------------------------------------------------------------------------
# Keypoint method comparison config.
# Runs six keypoint pipelines on all dataset samples and writes comparison.csv.
# ---------------------------------------------------------------------------
name: compare_keypoint_methods

base_pipeline: ../keypoint/akaze_pipeline.yaml

combinations:
  - label: akaze
    pipeline: ../keypoint/akaze_pipeline.yaml
  - label: brisk
    pipeline: ../keypoint/brisk_pipeline.yaml
  - label: kaze
    pipeline: ../keypoint/kaze_pipeline.yaml
  - label: orb
    pipeline: ../keypoint/orb_pipeline.yaml
  - label: sift
    pipeline: ../keypoint/sift_pipeline.yaml
  - label: surf
    pipeline: ../keypoint/surf_pipeline.yaml

dataset:
  root: ../../../datasets
  pattern_sources: [source, moving]
  pattern_targets: [target, reference]
  include: []

output:
  root: ../../../outputs/compare/keypoint
  save_visuals: true
  summary_csv: true

# 批处理自身的可视化设置；不继承 keypoint pipeline YAML。
visualization:
  # false 图前景阈值；仅影响可视化。0 表示显示所有非黑像素。
  false_color_foreground_threshold: 0
  # 是否保存 source/target 原图前景 mask，以及 warped source/target 前景重叠图。
  save_foreground_masks: true
  # 图片总开关在 output.save_visuals；这里控制各类图片。
  draw_keypoints: true
  draw_matches: true
  # 点特征匹配图层级；可选 RAW / FILTERED / INLIERS。
  match_views: [RAW, FILTERED, INLIERS]
  max_matches_drawn: 100
  save_originals: true
  save_warped: true
  save_blend: true
  save_false_color_overlay: true
