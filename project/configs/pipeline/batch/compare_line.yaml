# ---------------------------------------------------------------------------
# 线方法对比配置：遍历 (检测器 × 描述子) 组合，批量跑完输出总表
# ---------------------------------------------------------------------------
name: compare_line_methods

# 基础配置模板
base_pipeline: ../structure/line_pipeline.yaml
base_structure: ../../structure/line.yaml

# 待对比的检测器与描述子组合
combinations:
  - extractor: LSD
    descriptor: LBD
  - extractor: LSD
    descriptor: MSLD
  - extractor: LSD
    descriptor: LINE_SIFT
  - extractor: FLD
    descriptor: LBD
  - extractor: FLD
    descriptor: MSLD
  - extractor: FLD
    descriptor: LINE_SIFT
  - extractor: HOUGH_LINES_P
    descriptor: LBD
  - extractor: HOUGH_LINES_P
    descriptor: MSLD
  - extractor: HOUGH_LINES_P
    descriptor: LINE_SIFT

# 数据集与输出
dataset:
  root: ../../../datasets
  # source 图像文件名关键词候选；DatasetLoader 按顺序寻找源图。
  pattern_sources: [source, moving]
  # target 图像文件名关键词候选；DatasetLoader 按顺序寻找目标图。
  pattern_targets: [target, reference]
  include: []

output:
  root: ../../../outputs/compare
  # 是否保存当前 compare 任务下的全部图片输出；恢复为 true 后，继续按下方 visualization 的分类开关落盘。
  save_visuals: true
  summary_csv: true

# 批处理自身的可视化设置；不继承 structure pipeline YAML。
visualization:
  draw_keypoints: false
  draw_matches: true
  # 结构匹配图使用的对应关系；可选 RAW / INLIERS。
  structure_match_source: INLIERS
  max_matches_drawn: 100
  save_structure_responses: true
  save_originals: true
  save_warped: true
  save_blend: true
  save_false_color_overlay: true
