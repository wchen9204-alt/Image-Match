# ---------------------------------------------------------------------------
# 频域直接法 + KAZE 点特征初始值临时对比 pipeline
# 当前文件仅用于和其它点特征初始值做横向对比；测试完成后可直接删除整个 frequency_compare 目录。
# ---------------------------------------------------------------------------
name: frequency_direct_kaze_pipeline

method_family: direct
direct: ../../direct/fourier_mellin.yaml
evaluator: ../../evaluator/metrics.yaml

io:
  image1: ../../../datasets/test01/source.png
  image2: ../../../datasets/test01/target.png
  output_dir: ../../../outputs

visualization:
  # false 图前景阈值；仅影响可视化。0 表示显示所有非黑像素。
  false_color_foreground_threshold: 0
  # 是否保存 source/target 原图前景 mask，以及 warped source/target 前景重叠图。
  save_foreground_masks: true
  draw_matches: false
  warp: true
  show_source_window: false
  show_target_window: false
  show_warped_window: false
  wait_key: 0

feature_initializer:
  enabled: true
  # 初值使用策略：ACCEPTED_ONLY 仅使用通过完整质量门控的点特征结果。
  # ESTIMATED_WHEN_AVAILABLE 会使用已估计出的合法变换；没有合法矩阵时仍直接使用原图。
  seed_mode: ACCEPTED_ONLY
  final_validation_reference: BEST_OF_DIRECT_AND_INITIALIZER
  candidate:
    # 可选值示例：SIFT / SURF / ORB / BRISK / KAZE / AKAZE。
    name: KAZE
    keypoint: ../../keypoint/kaze.yaml
  matcher: ../../matcher/bf.yaml
  filters:
    - ../../filter/ratio_test.yaml
    - ../../filter/cross_check.yaml
    - ../../filter/pairwise_rigid_consistency.yaml
  geometry: ../../geometry/rigid.yaml
  acceptance:
    min_inliers: 2
    min_inlier_ratio: -1
    min_inlier_spatial_coverage: -1
  validation:
    warp_overlap:
      enabled: true
      min_containment: 0.90
      foreground_threshold: 5
      # 局部包含率的像素匹配容差；0 表示严格像素重叠。
      containment_tolerance_pixels: 1
    height_difference:
      # 使用有效重叠前景内的绝对高度差进行最终质量验证；启用全局高度偏移补偿。
      enabled: true
      # false：原始高度差未通过时直接失败；true：原始高度差未通过时，使用有效重叠区域有符号高度差的90%截尾均值进行全局补偿复检。
      compensate_global_height_offset: true
      # 用于成功判定的高度差分位数：50 / 75 / 90 / 95。
      percentile: 90
      # 所选分位数不超过 0.10 时通过；当前单位为归一化灰度。
      max_abs_error: 0.10
validation:
  # 共享质量阈值文件，集中维护各验证器参数。
  profile: ../../../validation/quality_profiles.yaml
  # 当前方法使用的验证参数预设；下面各验证器只覆盖 enabled 开关。
  preset: direct_confidence_low
  direct_quality:
    enabled: true
  warp_overlap:
    enabled: true
  edge_structure_diagnostic:
    enabled: false
  height_difference:
    enabled: true
