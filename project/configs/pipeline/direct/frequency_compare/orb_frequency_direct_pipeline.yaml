# ---------------------------------------------------------------------------
# 频域直接法 + ORB 点特征初始值临时对比 pipeline
# 当前文件仅用于和其它点特征初始值做横向对比；测试完成后可直接删除整个 frequency_compare 目录。
# ---------------------------------------------------------------------------
name: frequency_direct_orb_pipeline

method_family: direct
direct: ../../direct/fourier_mellin.yaml
evaluator: ../../evaluator/metrics.yaml

io:
  image1: ../../../datasets/test01/source.png
  image2: ../../../datasets/test01/target.png
  output_dir: ../../../outputs

visualization:
  draw_matches: false
  warp: true
  show_source_window: false
  show_target_window: false
  show_warped_window: false
  wait_key: 0

feature_initializer:
  enabled: true
  # 初值使用策略：ACCEPTED_ONLY 仅使用通过完整质量门控的点特征结果。
  # ESTIMATED_WHEN_AVAILABLE 会使用已估计出的合法变换；没有合法矩阵时仍直接使用原图。
  seed_mode: ACCEPTED_ONLY
  final_validation_reference: BEST_OF_DIRECT_AND_INITIALIZER
  candidate:
    # 可选值示例：SIFT / SURF / ORB / BRISK / KAZE / AKAZE。
    name: ORB
    keypoint: ../../keypoint/orb.yaml
  matcher: ../../matcher/bf.yaml
  filters:
    - ../../filter/ratio_test.yaml
    - ../../filter/cross_check.yaml
    - ../../filter/pairwise_rigid_consistency.yaml
  geometry: ../../geometry/rigid.yaml
  acceptance:
    min_inliers: 2
    min_inlier_ratio: -1
    min_inlier_spatial_coverage: -1
  validation:
    warp_overlap:
      enabled: true
      min_containment: 0.90
      foreground_threshold: 10
    photometric:
      enabled: true
      max_nmad: 0.15

validation:
  warp_overlap:
    enabled: true
    min_containment: 0.90
    foreground_threshold: 5
  photometric:
    enabled: true
    max_nmad: 0.15
  edge_alignment:
    enabled: true
    min_iou: 0.08
    canny_low_threshold: 50
    canny_high_threshold: 150
    dilate_size: 3
    min_edge_pixels: 20
  direct_quality:
    enabled: true
    fail_on_violation: true
    min_confidence: 0.01
