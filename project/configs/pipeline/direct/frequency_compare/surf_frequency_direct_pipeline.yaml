# ---------------------------------------------------------------------------
# 频域直接法 + SURF 点特征初始值临时对比 pipeline
# 当前文件仅用于和其它点特征初始值做横向对比；测试完成后可直接删除整个 frequency_compare 目录。
# ---------------------------------------------------------------------------
name: frequency_direct_surf_pipeline

# 方法族；可选项：keypoint / structure / direct
method_family: direct

# 直接法算法配置路径；FREQUENCY 族当前仅保留 fourier_mellin.yaml
direct: ../../direct/fourier_mellin.yaml

# 评估指标配置路径；为空时不加载额外 evaluator
evaluator: ../../evaluator/metrics.yaml

io:
  image1: ../../../datasets/test01/source.png
  image2: ../../../datasets/test01/target.png
  output_dir: ../../../outputs

visualization:
  # 频域直接法通常只产出全局矩阵，因此默认关闭点对图。
  draw_matches: false
  warp: true
  show_source_window: false
  show_target_window: false
  show_warped_window: false
  wait_key: 0

feature_initializer:
  # 是否在直接法前尝试点特征初始估计；默认 false。
  enabled: true
  # 直接法最终成功判定参考；可选 DIRECT_ONLY / BEST_OF_DIRECT_AND_INITIALIZER。
  # DIRECT_ONLY: 只用直接法最终 warp 结果做成功判定。
  # BEST_OF_DIRECT_AND_INITIALIZER: direct 和已接受的点特征初值分别按各自规则判定；
  # 若只有一方成功则直接采用成功方，若两者都成功则比较双方质量后选择更优结果。
  final_validation_reference: BEST_OF_DIRECT_AND_INITIALIZER
  # 单个点特征候选；不配置时表示不使用点特征初始估计。
  candidate:
    # 可选值示例：SIFT / SURF / ORB / BRISK / KAZE / AKAZE。
    name: SURF
    keypoint: ../../keypoint/surf.yaml
  # 初始化阶段复用点特征 pipeline 的 matcher/filter/geometry 链路。
  matcher: ../../matcher/bf.yaml
  filters:
    - ../../filter/ratio_test.yaml
    - ../../filter/cross_check.yaml
    - ../../filter/pairwise_rigid_consistency.yaml
  geometry: ../../geometry/rigid.yaml
  acceptance:
    # 初始化候选最低内点数；和点特征主线的 match_quality 保持一致。
    min_inliers: 1
    # 初始化候选最低内点率；小于 0 表示禁用。
    min_inlier_ratio: -1
    # 初始化候选最低空间覆盖率；和点特征主线的 match_quality 保持一致。
    min_inlier_spatial_coverage: 0.05
  validation:
    warp_overlap:
      enabled: true
      min_containment: 0.90
      min_bidirectional_coverage: 0.98
      accept_if_either_passes: true
      foreground_threshold: 10
    photometric:
      enabled: true
      max_nmad: 0.15
      max_nmad_for_coverage_only: 0.095

validation:
  warp_overlap:
    enabled: true
    min_containment: 0.70
    min_bidirectional_coverage: 0.98
    accept_if_either_passes: true
    foreground_threshold: 5
  photometric:
    enabled: true
    max_nmad: 0.15
    max_nmad_for_coverage_only: -1
  edge_alignment:
    enabled: true
    min_iou: 0.08
    canny_low_threshold: 50
    canny_high_threshold: 150
    dilate_size: 3
    min_edge_pixels: 20
  direct_quality:
    enabled: true
    fail_on_violation: true
    min_confidence: 0.01
