# ---------------------------------------------------------------------------
# 频域直接法通用 pipeline
# 当前文件承载频域直接法共享的 IO、可视化与验证配置；
# 具体算法通过 direct 指向对应配置。
# ---------------------------------------------------------------------------
name: frequency_direct_pipeline

# 方法族；可选项：keypoint / structure / direct
method_family: direct

# 直接法算法配置路径；FREQUENCY 族可切换 phase_correlation.yaml / fourier_mellin.yaml
direct: ../../direct/fourier_mellin.yaml

# 评估指标配置路径；为空时不加载额外 evaluator
evaluator: ../../evaluator/metrics.yaml

io:
  image1: ../../../datasets/Test01/source.png
  image2: ../../../datasets/Test01/target.png
  output_dir: ../../../outputs

visualization:
  # 频域直接法通常只产出全局矩阵，因此默认关闭点对图。
  draw_matches: false
  warp: true
  show_source_window: false
  show_target_window: false
  show_warped_window: false
  wait_key: 0

validation:
  warp_overlap:
    # 是否启用 warp 后的前景局部包含率验证。
    enabled: true
    # 最低局部包含率；默认值 0.20，低于该值时样本判失败。
    min_containment: 0.70
    # 频域直接法常用于低灰度前景、黑背景图像，因此阈值保持更低。
    foreground_threshold: 5
  photometric:
    # 是否启用重叠区域光度误差 NMAD 验证。
    enabled: true
    # 最大 NMAD 阈值；高于该值时样本判失败。
    max_nmad: 0.15
