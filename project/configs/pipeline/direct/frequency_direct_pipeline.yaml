# ---------------------------------------------------------------------------
# 频域直接法通用 pipeline
# 当前文件承载频域直接法共享的 IO、可视化与验证配置；
# 具体算法通过 direct 指向对应配置。
# ---------------------------------------------------------------------------
name: frequency_direct_pipeline

# 方法族；可选项：keypoint / structure / direct
method_family: direct

# 直接法算法配置路径；FREQUENCY 族当前仅保留 fourier_mellin.yaml
direct: ../../direct/fourier_mellin.yaml

# 评估指标配置路径；为空时不加载额外 evaluator
evaluator: ../../evaluator/metrics.yaml

io:
  image1: ../../../datasets/test76/source.png
  image2: ../../../datasets/test76/target.png
  output_dir: ../../../outputs

visualization:
  # 频域直接法通常只产出全局矩阵，因此默认关闭点对图。
  draw_matches: false
  warp: true
  show_source_window: false
  show_target_window: false
  show_warped_window: false
  wait_key: 0

feature_initializer:
  # 是否在直接法前尝试点特征初始估计；默认 false。
  enabled: true
  # 直接法最终成功判定参考；可选 DIRECT_ONLY / BEST_OF_DIRECT_AND_INITIALIZER。
  # DIRECT_ONLY: 只用直接法最终 warp 结果做成功判定。
  # BEST_OF_DIRECT_AND_INITIALIZER: direct 和已接受的点特征初值分别按各自规则判定；
  # 若只有一方成功则直接采用成功方，若两者都成功则比较双方质量后选择更优结果。
  final_validation_reference: BEST_OF_DIRECT_AND_INITIALIZER
  # 单个点特征候选；不配置时表示不使用点特征初始估计。
  candidate:
    # 可选值示例：SIFT / SURF / ORB / BRISK / KAZE / AKAZE。
    name: AKAZE
    keypoint: ../../keypoint/akaze.yaml
  # 初始化阶段复用点特征 pipeline 的 matcher/filter/geometry 链路。
  matcher: ../../matcher/bf.yaml
  filters:
    - ../../filter/ratio_test.yaml
    - ../../filter/cross_check.yaml
    - ../../filter/pairwise_rigid_consistency.yaml
  geometry: ../../geometry/rigid.yaml
  acceptance:
    # 初始化候选最低内点数；和 AKAZE 点特征 pipeline 的 match_quality 保持一致。
    min_inliers: 1
    # 初始化候选最低内点率；小于 0 表示禁用。
    min_inlier_ratio: -1
    # 初始化候选最低空间覆盖率；和 AKAZE 点特征 pipeline 的 match_quality 保持一致。
    min_inlier_spatial_coverage: 0.05
  validation:
    warp_overlap:
      # 初值采用阶段按点特征法的 warp 覆盖口径判断，不继承直接法最终验证阈值。
      enabled: true
      # 最低局部包含率；和 AKAZE 点特征 pipeline 保持一致。
      min_containment: 0.90
      # 双向 coverage 最低阈值；和 AKAZE 点特征 pipeline 保持一致。
      min_bidirectional_coverage: 0.98
      # containment 或双向 coverage 任一强通过即可，兼容局部图包含场景。
      accept_if_either_passes: true
      # 频域直接法常用于低灰度前景、黑背景图像，因此阈值保持更低。
      foreground_threshold: 5
    photometric:
      # 初值采用阶段按 AKAZE 点特征 pipeline 的光度阈值判断。
      enabled: true
      # 最大 NMAD 阈值；和 AKAZE 点特征 pipeline 保持一致。
      max_nmad: 0.15
      # 仅靠 coverage 放行时的附加 NMAD 阈值；和 AKAZE 点特征 pipeline 保持一致。
      max_nmad_for_coverage_only: 0.095

validation:
  warp_overlap:
    # 是否启用 warp 后的前景局部包含率验证。
    enabled: true
    # 最低局部包含率；默认值 0.20，低于该值时样本判失败。
    min_containment: 0.70
    # 双向 coverage 最低阈值；取 source / target coverage 的较大值。
    min_bidirectional_coverage: 0.98
    # containment 或双向 coverage 任一达标即可，兼容局部图包含场景。
    accept_if_either_passes: true
    # 频域直接法常用于低灰度前景、黑背景图像，因此阈值保持更低。
    foreground_threshold: 5
  photometric:
    # 是否启用重叠区域光度误差 NMAD 验证。
    enabled: true
    # 常规最大 NMAD 阈值；当前频域直接法按你的判断放宽到 0.15，
    # 允许 Test04 / Test07 / Test09 这类整体对齐但仍存在少量光度差的样本通过。
    max_nmad: 0.15
    # 当前直接禁用 coverage-only 的附加更严阈值；小于 0 表示禁用。
    max_nmad_for_coverage_only: -1
  edge_alignment:
    # 是否启用重叠区域边缘 IoU 验证；适用于能输出 warp 的直接法。
    enabled: true
    # 最低边缘 IoU；默认值 0.08，用于拦截覆盖充分但结构错位的结果。
    min_iou: 0.08
    # Canny 边缘检测低阈值。
    canny_low_threshold: 50
    # Canny 边缘检测高阈值。
    canny_high_threshold: 150
    # 边缘 mask 膨胀核尺寸；默认值 3，用于容忍少量像素级偏移。
    dilate_size: 3
    # 最低边缘像素数；低于该值时认为样本边缘不足，验证失败。
    min_edge_pixels: 20
  direct_quality:
    # 频域直接法默认用响应值作为 pipeline 级 confidence。
    enabled: true
    fail_on_violation: true
    min_confidence: 0.01
