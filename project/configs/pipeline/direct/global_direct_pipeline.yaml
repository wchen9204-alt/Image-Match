# ---------------------------------------------------------------------------
# 全局直接法通用 pipeline
# 当前文件承载全局直接法共享的 IO、可视化与验证配置；
# 具体算法通过 direct 指向对应配置。
# ---------------------------------------------------------------------------
name: global_direct_pipeline

# 方法族；可选项：keypoint / structure / direct
method_family: direct

# 直接法算法配置路径；GLOBAL 族可切换 ecc.yaml / global_lk.yaml / esm_rigid.yaml / zncc_rigid.yaml
direct: ../../direct/ecc.yaml

# 评估指标配置路径；为空时不加载额外 evaluator
evaluator: ../../evaluator/metrics.yaml

io:
  image1: ../../../datasets/Test01/source.png
  image2: ../../../datasets/Test01/target.png
  output_dir: ../../../outputs

visualization:
  # 全局直接法多为整图优化，通常没有稳定点对可画。
  draw_matches: false
  warp: true
  show_source_window: false
  show_target_window: false
  show_warped_window: false
  wait_key: 0

validation:
  warp_overlap:
    # 是否启用 warp 后的前景 IoU 验证。
    enabled: true
    # 最低 IoU 阈值；低于该值时样本判失败。
    min_iou: 0.20
    # 前景二值化阈值。
    foreground_threshold: 10
  photometric:
    # 是否启用重叠区域光度误差 NMAD 验证。
    enabled: true
    # 最大 NMAD 阈值；高于该值时样本判失败。
    max_nmad: 0.15
