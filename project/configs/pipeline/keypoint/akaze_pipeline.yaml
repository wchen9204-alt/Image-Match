# ---------------------------------------------------------------------------
# AKAZE 配准流水线配置
# 当前文件用于组织一条完整的点特征配准流程，可按需调整
# keypoint / matcher / filters / geometry 等子配置。
# ---------------------------------------------------------------------------
name: akaze_pipeline

# 支持的关键点方法：
# akaze / brisk / kaze / orb / sift / surf
keypoint: ../../keypoint/akaze.yaml

# 支持的匹配器：
# bf / flann
matcher: ../../matcher/bf.yaml

# 支持的过滤器：
# ratio_test / cross_check / distance_distribution /
# distance_threshold / gms / min_distance
filters:
   - ../../filter/ratio_test.yaml
  # - ../../filter/cross_check.yaml
  # - ../../filter/pairwise_rigid_consistency.yaml

# 多层暗部 fallback 配置。
multilayer_dark_fallback:
  enabled: true
  # 首选结果未达到以下任一门槛时，进入多层暗部重试。
  # 仅当 source、target 两侧前景重合率都低于该值时，切换多层暗部。
  min_foreground_overlap_ratio: 0.75
  max_height_difference: 0.10
  min_inlier_ratio: 0.15
  # 阈值按灰度范围从 255 均匀递减生成。
  layer_count: 10

# 支持的几何模型：
# rigid / similarity / affine / homography
geometry: ../../geometry/rigid.yaml
evaluator: ../../evaluator/metrics.yaml

io:
  image1: ../../../datasets/test05/source.png
  image2: ../../../datasets/test05/target.png
  output_dir: ../../../outputs

validation:
  # 共享质量阈值文件，集中维护各验证器参数。
  profile: ../../validation/quality_profiles.yaml
  # 当前方法使用的验证参数预设；下面各验证器只覆盖 enabled 开关。
  preset: keypoint
  match_quality:
    enabled: true
  warp_overlap:
    enabled: false
  edge_structure_diagnostic:
    enabled: false
  height_difference:
    enabled: true
