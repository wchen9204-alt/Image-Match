# ---------------------------------------------------------------------------
# BRISK 配准流水线配置
# 当前文件用于组织一条完整的点特征配准流程，可按需调整
# keypoint / matcher / filters / geometry 等子配置。
# ---------------------------------------------------------------------------
name: brisk_pipeline

# 支持的关键点方法：
# akaze / brisk / kaze / orb / sift / surf
keypoint: ../../keypoint/brisk.yaml

# 支持的匹配器：
# bf / flann
matcher: ../../matcher/bf.yaml

# 支持的过滤器：
# ratio_test / cross_check / distance_distribution /
# distance_threshold / gms / min_distance
filters:
  - ../../filter/ratio_test.yaml
  - ../../filter/cross_check.yaml
  - ../../filter/pairwise_rigid_consistency.yaml

# 支持的几何模型：
# rigid / similarity / affine / homography
geometry: ../../geometry/rigid.yaml
evaluator: ../../evaluator/metrics.yaml

io:
  image1: ../../../datasets/test01/source.png
  image2: ../../../datasets/test01/target.png
  output_dir: ../../../outputs

visualization:
  # false 图前景阈值；仅影响可视化。0 表示显示所有非黑像素。
  false_color_foreground_threshold: 0
  # 是否保存 source/target 原图前景 mask，以及 warped source/target 前景重叠图。
  save_foreground_masks: true
  draw_keypoints: true
  draw_matches: true
  max_matches_drawn: 100
  warp: true
  show_source_window: true
  show_target_window: true
  show_warped_window: true
  wait_key: 0

validation:
  # 共享质量阈值文件，集中维护各验证器参数。
  profile: ../../validation/quality_profiles.yaml
  # 当前方法使用的验证参数预设；下面各验证器只覆盖 enabled 开关。
  preset: keypoint
  match_quality:
    enabled: true
  warp_overlap:
    enabled: true
  edge_structure_diagnostic:
    enabled: false
  height_difference:
    enabled: true
