# ---------------------------------------------------------------------------
# ORB 配准流水线配置
# 当前文件用于组织一条完整的点特征配准流程，可按需调整
# keypoint / matcher / filters / geometry 等子配置。
# ---------------------------------------------------------------------------
name: orb_pipeline

# 关键点方法；可选 akaze / brisk / kaze / orb / sift / surf。
keypoint: ../../keypoint/orb.yaml

# 匹配器；可选 bf / flann。
matcher: ../../matcher/bf.yaml

# 过滤器；可选 ratio_test / cross_check / distance_distribution /
# distance_threshold / gms / min_distance。
filters:
  - ../../filter/ratio_test.yaml
  - ../../filter/cross_check.yaml
  - ../../filter/pairwise_rigid_consistency.yaml

# 几何模型；可选 rigid / similarity / affine / homography。
geometry: ../../geometry/rigid.yaml
evaluator: ../../evaluator/metrics.yaml

io:
  image1: ../../../datasets/test05/source.png
  image2: ../../../datasets/test05/target.png
  output_dir: ../../../outputs

visualization:
  draw_keypoints: true
  draw_matches: true
  match_views: [RAW, FILTERED, INLIERS]
  max_matches_drawn: 100
  warp: true
  show_source_window: false
  show_target_window: false
  show_warped_window: false
  wait_key: 0

validation:
  warp_overlap:
    # 是否启用 warp 后的前景局部包含率验证。
    enabled: true
    # 最低局部包含率；默认值 0.20，本点特征主线设置为 0.90。
    # 计算方式：intersection / min(source 原始前景面积, target 前景面积)。
    # 适用于一张图可能是另一张图局部的点特征配准场景。
    min_containment: 0.90
    # 双向 coverage 最低阈值；取 source / target coverage 的较大值。
    min_bidirectional_coverage: 0.98
    # containment 或双向 coverage 任一强通过即可，兼容局部图包含场景。
    accept_if_either_passes: true
    # 前景二值化阈值。
    foreground_threshold: 10
  match_quality:
    # 是否检查匹配质量统计。
    enabled: true
    # 是否把 min_inliers / min_inlier_ratio / max_reproj_error 不满足判为失败。
    # true 表示这些阈值由 YAML 直接控制样例成功/失败；false 表示仅输出日志告警。
    fail_on_violation: true
    # 最少内点数；当前改为“只要有内点即可通过”，因此这里设为 1。
    min_inliers: 2
    # 最低内点率；当前不再作为成功/失败判断条件，因此设为 -1 禁用。
    min_inlier_ratio: -1
    # 最大重投影误差；-1 表示不启用该项阈值。
    max_reproj_error: -1
    # 最终内点在 source / target 前景包围盒中的最低空间覆盖率。
    # 用于拦截少量内点集中在局部边缘导致的错误 rigid。
    min_inlier_spatial_coverage: 0.05
  photometric:
    # 是否启用重叠区域光度误差 NMAD 验证。
    enabled: true
    # 最大 NMAD 阈值；高于该值时样例判失败。
    max_nmad: 0.15
    # 仅靠 coverage 放行、但 containment 未达标时使用的更严格 NMAD。
    max_nmad_for_coverage_only: 0.095
