# ---------------------------------------------------------------------------
# SIFT 配准流水线配置
# 当前文件用于组织一条完整的特征配准流水线，可按需手动调整
# keypoint / matcher / filters / geometry 等子配置
# ---------------------------------------------------------------------------
name: sift_pipeline

# 支持的关键点方法：
# akaze / brisk / kaze / orb / sift / surf
keypoint:  ../../keypoint/sift.yaml

# 支持的匹配器：
# bf / flann
matcher:  ../../matcher/flann.yaml

# 支持的过滤器：
# ratio_test / cross_check / distance_distribution /
# distance_threshold / gms / min_distance
filters:
  - ../../filter/ratio_test.yaml
  - ../../filter/cross_check.yaml
 # - ../../filter/distance_distribution.yaml
 # - ../../filter/distance_threshold.yaml

# 支持的几何模型：
# rigid / similarity / affine / homography
geometry: ../../geometry/similarity.yaml

io:
  image1: ../../../datasets/Test01/source.png
  image2: ../../../datasets/Test01/target.png
  output_dir: ../../../outputs

visualization:
  draw_keypoints: true
  draw_matches: true
  max_matches_drawn: 100
  warp: true
  show_source_window: true
  show_target_window: true
  show_warped_window: true
  wait_key: 0

validation:
  # warp 后的 source 与 target 前景重合率校验。
  # enabled=true 时，IoU 低于 min_iou 的样本不会进入 Successful samples。
  warp_overlap:
    enabled: true
    min_iou: 0.20
    foreground_threshold: 10
