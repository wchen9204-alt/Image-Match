# ---------------------------------------------------------------------------
# 深度学习流水线：SuperPoint + SuperGlue
# 用途：SuperPoint 提取点、SuperGlue 完成匹配，再由现有几何估计器求解变换。
# 说明：该配置名表示“特征提取器 + 匹配器”的具体组合，与 SuperPoint + LightGlue 独立维护。
# ---------------------------------------------------------------------------
# 流水线名称；默认：superpoint_superglue_learning_pipeline；用于日志和输出目录命名。
name: superpoint_superglue_learning_pipeline
# 方法族；默认：learning；本配置固定属于 learning 方法族。
method_family: learning

# 学习匹配器配置；默认：../../learning/superpoint_superglue.yaml；相对本文件解析。
learning: ../../learning/superpoint_superglue.yaml
# 几何估计配置；默认：../../geometry/homography.yaml；可选 Homography/Affine/Rigid/Similarity 配置。
geometry: ../../geometry/rigid.yaml
# 评测指标配置；默认：../../evaluator/metrics.yaml。
evaluator: ../../evaluator/metrics.yaml

io:
  # 源图路径；默认：../../../datasets/test01/source.png；可替换为任意待配准图像。
  image1: ../../../datasets/test01/source.png
  # 目标图路径；默认：../../../datasets/test01/target.png；可替换为任意待配准图像。
  image2: ../../../datasets/test01/target.png
  # 输出根目录；默认：../../../outputs；流水线会在其下创建 learning 子目录。
  output_dir: ../../../outputs

visualization:
  # false 图前景阈值；仅影响可视化。0 表示显示所有非黑像素。
  false_color_foreground_threshold: 0
  # 是否保存 source/target 原图前景 mask，以及 warped source/target 前景重叠图。
  save_foreground_masks: true
  # 是否绘制匹配图；默认：true；可选：true / false。
  draw_matches: true
  # 最大绘制匹配数；默认：50；小于等于 0 表示不限制。
  max_matches_drawn: 200
  # 是否保存 warped 图像；默认：true；可选：true / false。
  warp: true
  # 是否弹出源图窗口；默认：false；可选：true / false。
  show_source_window: false
  # 是否弹出目标图窗口；默认：false；可选：true / false。
  show_target_window: false
  # 是否弹出 warped 图像窗口；默认：false；可选：true / false。
  show_warped_window: false
  # OpenCV 窗口等待时间；默认：0；单位：毫秒，0 表示无限等待。
  wait_key: 0

validation:
  # 共享质量阈值文件，集中维护各验证器参数。
  profile: ../../validation/quality_profiles.yaml
  # 当前方法使用的验证参数预设；下面各验证器只覆盖 enabled 开关。
  preset: learning
  warp_overlap:
    enabled: true
  edge_structure_diagnostic:
    enabled: false
  height_difference:
    enabled: true
