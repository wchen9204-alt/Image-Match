# ---------------------------------------------------------------------------
# SIFT 配准流程配置
# 当前文件用于组织一条完整的特征配准流程，可按需手动调整
# feature / matcher / filters / geometry 等子配置
# ---------------------------------------------------------------------------
name: sift_pipeline

feature:  configs/feature/sift.yaml

matcher:  configs/matcher/flann.yaml

filters:
  - configs/filter/ratio_test.yaml
  - configs/filter/cross_check.yaml

geometry: configs/geometry/rigid.yaml

io:
  image1: datasets/test10/source.png
  image2: datasets/test10/target.png
  output_dir: outputs

visualization:
  draw_keypoints: true
  draw_matches: true
  draw_inliers_only: true
  max_matches_drawn: 100
  warp: true
  show_source_window: true
  show_target_window: true
  show_warped_window: true
  wait_key: 0
