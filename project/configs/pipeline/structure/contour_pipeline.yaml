# ---------------------------------------------------------------------------
# 轮廓结构配准流水线配置
# 当前文件用于组织基于轮廓结构的配准流程。
# ---------------------------------------------------------------------------
name: contour_pipeline
# method_family 默认值：无固定默认；缺省时会根据是否存在 structure 路径自动推断为 structure
method_family: structure

# 支持的结构方法：
# edge / line / contour
structure: ../../structure/contour.yaml

# geometry 默认值：空（不配置则不做几何估计器）
geometry: ../../geometry/rigid.yaml

# evaluator 默认值：空（不配置则不加载额外评估器）
evaluator: ../../evaluator/metrics.yaml

# filters 默认值：空列表
filters:
 # - ../../filter/ratio_test.yaml

io:
  # image1 / image2 默认值：空
  image1: ../../../datasets/Test01/source.png
  image2: ../../../datasets/Test01/target.png
  # output_dir 默认值：outputs
  output_dir: ../../../outputs

visualization:
  # 默认值：true / false / 100 / true / false / false / false / 0
  draw_matches: true
  draw_inliers_only: true
  max_matches_drawn: 100
  warp: true
  show_source_window: false
  show_target_window: false
  show_warped_window: false
  wait_key: 0

validation:
  warp_overlap:
    # 默认值：false / 0.20 / 10
    enabled: true
    min_iou: 0.20
    foreground_threshold: 10
  structure_overlap:
    enabled: true
    min_iou: 0.12
    foreground_threshold: 0
    dilate_size: 7
  photometric:
    # 默认值：false / 0.15
    enabled: true
    max_nmad: 0.15
