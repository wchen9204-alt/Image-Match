# ---------------------------------------------------------------------------
# 轮廓结构配准流水线配置
# 当前文件用于组织基于轮廓结构的配准流程。
# ---------------------------------------------------------------------------
name: contour_pipeline
# method_family 默认值：无固定默认；缺省时会根据是否存在 structure 路径自动推断为 structure
method_family: structure

# 支持的结构方法：
# edge / line / contour
structure: ../../structure/contour.yaml

# geometry 默认值：空（不配置则不做几何估计器）
geometry: ../../geometry/rigid.yaml

# evaluator 默认值：空（不配置则不加载额外评估器）
evaluator: ../../evaluator/metrics.yaml

# filters 默认值：空列表
filters:
 # - ../../filter/ratio_test.yaml

io:
  # image1 / image2 默认值：空
  image1: ../../../datasets/test124/source.png
  image2: ../../../datasets/test124/target.png
  # output_dir 默认值：outputs
  output_dir: ../../../outputs

visualization:
  # false 图前景阈值；仅影响可视化。0 表示显示所有非黑像素。
  false_color_foreground_threshold: 0
  # 是否保存 source/target 原图前景 mask，以及 warped source/target 前景重叠图。
  save_foreground_masks: true
  # 默认值：true / false / 100 / true / false / false / false / 0
  draw_matches: true
  # 结构匹配图使用的对应关系；可选 RAW / INLIERS。
  structure_match_source: INLIERS
  max_matches_drawn: 100
  warp: true
  show_source_window: false
  show_target_window: false
  show_warped_window: false
  wait_key: 0

validation:
  method_quality:
    # 方法特征判定：只检查轮廓法自身产物是否充足；最终仍必须通过下面的通用判定。
    enabled: true
    fail_on_violation: true
    min_structures: 1
    min_structure_matches: 1
  warp_overlap:
    # 是否启用 warp 后的前景局部包含率验证；默认值：false。
    enabled: true
    # 最低局部包含率；默认值 0.20。
    min_containment: 0.70
    foreground_threshold: 20
    # 局部包含率的像素匹配容差；0 表示严格像素重叠。
    containment_tolerance_pixels: 0
  structure_overlap:
    enabled: true
    min_iou: 0.12
    foreground_threshold: 0
    dilate_size: 7
  photometric:
    # 默认值：false / 0.15
    enabled: true
    max_nmad: 0.15
