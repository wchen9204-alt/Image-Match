# ---------------------------------------------------------------------------
# 边缘结构配准流水线配置
# 当前文件用于组织基于边缘响应的结构配准流程。
# ---------------------------------------------------------------------------
name: edge_pipeline

# 支持的结构方法：
# edge / line / contour
structure: ../../structure/edge.yaml

io:
  image1: ../../../datasets/test1/source.png
  image2: ../../../datasets/test1/target.png
  output_dir: ../../../outputs

visualization:
  draw_matches: true
  draw_inliers_only: true
  max_matches_drawn: 100
  warp: true
  show_source_window: false
  show_target_window: false
  show_warped_window: false
  wait_key: 0

validation:
  warp_overlap:
    enabled: true
    min_iou: 0.20
    foreground_threshold: 10
  photometric:
    enabled: true
    max_nmad: 0.15
