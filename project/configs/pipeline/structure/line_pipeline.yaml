# ---------------------------------------------------------------------------
# 直线结构配准流水线配置
# 当前文件用于组织基于直线结构的配准流程。
# ---------------------------------------------------------------------------
name: line_pipeline
method_family: structure

# 支持的结构方法：
# edge / line / contour
structure: ../../structure/line.yaml

# 线段关联器优先直接输出基于线段中心一致性的仿射结果；缺少仿射时再回退到端点几何估计。
geometry: ../../geometry/rigid.yaml

io:
  image1: ../../../datasets/Test01/source.png
  image2: ../../../datasets/Test01/target.png
  output_dir: ../../../outputs

visualization:
  draw_matches: true
  draw_inliers_only: true
  max_matches_drawn: 100
  warp: true
  show_source_window: false
  show_target_window: false
  show_warped_window: false
  wait_key: 0

validation:
  warp_overlap:
    enabled: true
    min_iou: 0.20
    foreground_threshold: 10
  photometric:
    enabled: false
    max_nmad: 0.15

evaluator: ../../evaluator/metrics.yaml

filters:
 # - ../../filter/ratio_test.yaml
 # - ../../filter/distance_threshold.yaml
