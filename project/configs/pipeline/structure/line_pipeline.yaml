# ---------------------------------------------------------------------------
# 直线结构配准流水线配置
# 当前文件用于组织基于直线结构的配准流程。
# ---------------------------------------------------------------------------
name: line_pipeline

# 支持的结构方法：
# edge / line / contour
structure: ../../structure/line.yaml

# 线段匹配会转换为端点点对，再交给通用几何估计器做 RANSAC。
geometry: ../../geometry/rigid.yaml

io:
  image1: ../../../datasets/test1/source.png
  image2: ../../../datasets/test1/target.png
  output_dir: ../../../outputs

visualization:
  draw_matches: true
  draw_inliers_only: true
  max_matches_drawn: 100
  warp: true
  show_source_window: false
  show_target_window: false
  show_warped_window: false
  wait_key: 0
