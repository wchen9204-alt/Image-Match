# ---------------------------------------------------------------------------
# 直线结构配准流水线配置
# 当前文件用于组织基于直线结构的配准流程。
# ---------------------------------------------------------------------------
name: line_pipeline
method_family: structure

# 支持的结构方法：
# edge / line / contour
structure: ../../structure/line.yaml

# 线段关联器优先直接输出基于线段中心一致性的仿射结果；缺少仿射时再回退到端点几何估计。
geometry: ../../geometry/rigid.yaml

io:
  image1: ../../../datasets/test120/source.png
  image2: ../../../datasets/test120/target.png
  output_dir: ../../../outputs

visualization:
  # false 图前景阈值；仅影响可视化。0 表示显示所有非黑像素。
  false_color_foreground_threshold: 0
  # 是否保存 source/target 原图前景 mask，以及 warped source/target 前景重叠图。
  save_foreground_masks: true
  draw_matches: true
  # 结构匹配图使用的对应关系；可选 RAW / INLIERS。
  structure_match_source: INLIERS
  max_matches_drawn: 100
  warp: true
  show_source_window: false
  show_target_window: false
  show_warped_window: false
  wait_key: 0

validation:
  # 共享质量阈值文件，集中维护各验证器参数。
  profile: ../../validation/quality_profiles.yaml
  # 当前方法使用的验证参数预设；下面各验证器只覆盖 enabled 开关。
  preset: structure_line
  structure_overlap:
    enabled: true
  warp_overlap:
    enabled: true
  edge_structure_diagnostic:
    enabled: true
  height_difference:
    enabled: true
evaluator: ../../evaluator/metrics.yaml

filters:
#  - ../../filter/ratio_test.yaml
#  - ../../filter/distance_threshold.yaml
