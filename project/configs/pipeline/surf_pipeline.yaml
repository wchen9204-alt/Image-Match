# ---------------------------------------------------------------------------
# 配准流程配置：SURF + BF (L2) + RatioTest + CrossCheck + Homography
# ---------------------------------------------------------------------------
name: surf_bf_homography

feature:  configs/feature/surf.yaml
matcher:  configs/matcher/bf.yaml

filters:
  - configs/filter/ratio_test.yaml
  - configs/filter/cross_check.yaml

geometry: configs/geometry/homography.yaml

io:
  image1: datasets/test1/source.png
  image2: datasets/test1/target.png
  output_dir: outputs

visualization:
  draw_matches: true
  draw_inliers_only: true
  max_matches_drawn: 100
  warp: true
