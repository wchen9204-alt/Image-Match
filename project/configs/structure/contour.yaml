# 结构类型，可选：LINE / CONTOUR。
type: CONTOUR

extractor:
  # 当前实现：Canny 边缘 + findContours。
  method: CANNY_FIND_CONTOURS
  params:
    # Canny 前的高斯模糊核；0 表示关闭，>1 时自动归一化为奇数。
    blur_kernel: 3
    # 是否根据图像灰度中位数自动估计 Canny 双阈值。
    auto_canny: true

    # Canny 低阈值，默认值：50.0。
    cannyThreshold1: 50.0
    # Canny 高阈值，默认值：150.0。
    cannyThreshold2: 150.0
    # Canny 内部 Sobel 算子的孔径大小，可选：3 / 5 / 7。
    apertureSize: 3

    # 轮廓检索模式，可选：EXTERNAL / LIST / CCOMP / TREE。
    retrievalMode: TREE
    # 轮廓近似模式，可选：SIMPLE / NONE。
    chainApprox: SIMPLE

    # 最小轮廓面积，默认值：20.0。
    minArea: 24.0
    # 最小轮廓周长，默认值：0.0。
    minPerimeter: 0.0
    # 最少轮廓点数，默认值：3。
    minPoints: 3
    # 最小包围盒宽高；0 表示不限制。
    min_bbox_width: 6
    min_bbox_height: 6
    # 面积与包围盒面积的比值下限；0 表示不限制。
    min_extent: 0.10
    # 包围盒长宽比上限；0 表示不限制。
    max_aspect_ratio: 15.0
    # 最多保留轮廓数量，默认值：1000。
    maxContours: 1000
    # 绘制轮廓响应图时的线宽，默认值：1。
    contourThickness: 1

association:
  # 可选：CONTOUR_DESCRIPTOR / CHAMFER / HAUSDORFF / ICP。
  # CONTOUR_DESCRIPTOR 使用轮廓描述子匹配；后三者使用结构响应图做平移关联。
  method: CONTOUR_DESCRIPTOR
  params:
    contour_descriptor:
      # 描述子类型，可选：HU / MATCH_SHAPES / SHAPE_CONTEXT / FD / EFD。
      descriptor: FD
      matcher: BF

      # 匹配模式，可选：MATCH / KNN / RADIUS。
      match_mode: MATCH
      # KNN 模式保留的近邻数。
      knn_k: 2
      # RADIUS 模式的距离阈值。
      match_radius: 50.0
      # 进入后续阶段所需的最少匹配数。
      min_matches: 1

      # 几何一致性预筛：先做面积比预筛和一对一去重，再做平移或刚体一致性筛选。
      geometric_filter: true
      # 几何一致性模型，可选：TRANSLATION / RIGID。
      geometric_model: RIGID
      # 轮廓面积比例下限。
      area_ratio_min: 0.30
      # TRANSLATION 模式的质心平移一致性阈值。
      shift_consistency_threshold: 30.0
      # RIGID 模式的质心点对 RANSAC 阈值、迭代次数和最少内点数。
      rigid_ransac_threshold: 8.0
      rigid_ransac_iterations: 200
      rigid_min_inliers: 2

      # Fourier Descriptor 参数，仅 descriptor: FD 使用。
      fourier_sample_points: 128
      fourier_coefficients: 16

      # Elliptic Fourier Descriptor 参数，仅 descriptor: EFD 使用。
      efd_harmonics: 12
      efd_normalize_rotation: true
      efd_normalize_scale: true

      # Shape Context 参数，仅 descriptor: SHAPE_CONTEXT 使用。
      shape_context_sample_points: 64
      shape_context_radial_bins: 5
      shape_context_angular_bins: 12
      shape_context_inner_radius: 0.125
      shape_context_outer_radius: 2.0

    chamfer:
      searchRadius: 20
      step: 1
      maxPoints: 2000
      scoreThreshold: 0.25
      bidirectional: true

    hausdorff:
      searchRadius: 30
      step: 2
      maxPoints: 2000
      percentile: 0.95
      scoreThreshold: 3.0
      bidirectional: true

    icp:
      maxIterations: 30
      tolerance: 0.01
      maxPoints: 2000
      minCorrespondences: 20
      maxCorrespondenceDistance: 15.0
      scoreThreshold: 7.0
      initialization: CENTROID

estimation:
  # 结构匹配结果有效性阈值，当前主要保留用于兼容。
  responseThreshold: 0.01
