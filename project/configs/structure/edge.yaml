# 结构类型，可选：EDGE / LINE / CONTOUR。
type: EDGE

# 边缘响应生成配置。
# 已实现的边缘提取方法：CANNY / SOBEL / LOG / LAPLACIAN。
# 已实现的通用结构匹配方法：PHASE_CORRELATE / CHAMFER / HAUSDORFF / ICP。
extractor:
  # 默认值：CANNY。
  method: CANNY
  params:
    # 默认值：50.0。Canny 低阈值。
    threshold1: 50.0
    # 默认值：150.0。Canny 高阈值。
    threshold2: 150.0
    # 默认值：3。Canny 内部 Sobel 算子的孔径大小，可选：3 / 5 / 7。
    apertureSize: 3
    # 默认值：false。是否使用 L2 范数计算梯度幅值，仅 CANNY 使用。
    l2Gradient: false
    # 默认值：3。边缘算子前的高斯模糊核大小；偶数会自动调整为奇数。
    blurKernel: 3
    # 默认值：1。边缘响应图膨胀次数，用于增强连通性。
    dilateIterations: 1
    # 默认值：3。SOBEL / LOG / LAPLACIAN 的卷积核大小。
    kernelSize: 3
    # 默认值：1.0。Sobel / Laplacian 的响应缩放系数。
    scale: 1.0
    # 默认值：0.0。Sobel / Laplacian 的响应偏移量。
    delta: 0.0
    # 默认值：50.0。SOBEL / LOG / LAPLACIAN 归一化响应图的二值化阈值。
    responseThreshold: 50.0

association:
  # 默认值：PHASE_CORRELATE。
  # 可选：PHASE_CORRELATE / CHAMFER / HAUSDORFF / ICP。
  method: HAUSDORFF
  # 按匹配方法分组配置参数，避免不同方法共用同一层键名。
  params:
    phase_correlate:
      # 默认值：0.01。相位相关响应阈值，低于该值时认为匹配不可靠。
      responseThreshold: 0.01
      # 默认值：5。phaseCorrelate 前使用的高斯模糊核大小。
      phaseBlurKernel: 5
    chamfer:
      # 默认值：20。平移搜索半径，单位为像素。
      searchRadius: 20
      # 默认值：1。平移搜索步长，单位为像素。
      step: 1
      # 默认值：2000。最多采样的结构点数量。
      maxPoints: 2000
      # 默认值：2.0。平均距离阈值，越低越好，低于该值时认为匹配有效。
      # 倒角 score 的单位近似为像素；边缘响应较稀疏时通常需要 1~3。
      scoreThreshold: 0.25
      # 默认值：true。是否同时计算正向和反向平均距离。
      bidirectional: true
      # 默认值：PHASE_CORRELATE。初始平移方式，可选：PHASE_CORRELATE / ZERO。
      initialization: PHASE_CORRELATE
      # 默认值：5。使用 PHASE_CORRELATE 初始化时的高斯模糊核大小。
      phaseBlurKernel: 5
    hausdorff:
      # 默认值：20。平移搜索半径，单位为像素。
      searchRadius: 20
      # 默认值：1。平移搜索步长，单位为像素。
      step: 1
      # 默认值：2000。最多采样的结构点数量。
      maxPoints: 2000
      # 默认值：0.95。有序 Hausdorff 分位数；设为 1.0 时等价于严格最大距离。
      # 放宽建议：边缘噪声较多时可降到 0.85~0.90，降低离群边缘点影响。
      percentile: 0.90
      # 默认值：3.0。Hausdorff 距离阈值，越低越好，低于该值时认为匹配有效。
      # 放宽建议：边缘响应较稀疏或断裂时可提高到 5~8。
      scoreThreshold: 6.0
      # 默认值：true。是否同时计算正向和反向 Hausdorff 距离。
      bidirectional: true
    icp:
      # 默认值：2000。最多采样的结构点数量。
      maxPoints: 2000
      # 默认值：30。ICP 最大迭代次数。
      maxIterations: 50
      # 默认值：20。每轮迭代所需的最少有效近邻对应点数量。
      # 放宽建议：边缘点稀疏或遮挡较多时可降到 10。
      minCorrespondences: 10
      # 默认值：10.0。最大近邻对应距离，单位为像素。
      # 放宽建议：初始位移不够准时可提高到 20~30。
      maxCorrespondenceDistance: 25.0
      # 默认值：0.01。当平移增量小于该值时停止迭代。
      tolerance: 0.01
      # 默认值：2.0。平均对应距离阈值，越低越好，低于该值时认为匹配有效。
      # 放宽建议：可提高到 4~6，但过大容易接受错误匹配。
      scoreThreshold: 5.0
      # 默认值：CENTROID。初始平移方式，可选：CENTROID / ZERO。
      initialization: CENTROID

estimation:
  # 默认值：0.01。结构匹配结果的有效性阈值，保留用于兼容。
  # 当前平移模型直接复用匹配阶段输出的 translation / score。
  responseThreshold: 0.01
