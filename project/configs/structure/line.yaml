# ---------------------------------------------------------------------------
# 直线结构提取与关联配置
# ---------------------------------------------------------------------------
# 结构类型，可选：LINE / CONTOUR。
type: LINE

extractor:
  # 直线检测方法。
  # 当前支持：HOUGH_LINES_P / HOUGH_LINES / LSD / FLD。
  method: HOUGH_LINES

  params:
    # HOUGH_LINES / HOUGH_LINES_P 会先用 Canny 提取边缘。
    cannyThreshold1: 50.0
    cannyThreshold2: 150.0
    # Canny 内部 Sobel 算子的孔径大小，可选：3 / 5 / 7。
    apertureSize: 3

    # Hough 累加器的距离分辨率，单位为像素。
    rho: 1.0
    # Hough 累加器的角度分辨率，单位为度。
    thetaDegrees: 1.0
    # Hough 投票阈值；数值越大，检测出的线越少。
    threshold: 50

    # 最多保留的线段数量；会优先保留较长线段。
    maxLines: 300
    # 最短线段长度，HOUGH_LINES / HOUGH_LINES_P / LSD 均会使用。
    minLineLength: 30.0
    # HOUGH_LINES_P 中允许连接为同一线段的最大间隔。
    maxLineGap: 10.0
    # 绘制线段响应图时的线宽。
    lineThickness: 1
    deduplicateLines: false
    duplicateAngleDeg: 3.0
    duplicateDistance: 8.0

    # LSD 参数，仅 extractor.method: LSD 使用。
    lsd:
      # OpenCV LSD 细化模式：0(None) / 1(Standard) / 2(Advanced)。
      refine: 1
      scale: 0.8
      sigmaScale: 0.6
      quant: 2.0
      angTh: 22.5
      logEps: 0.0
      densityTh: 0.7
      nBins: 1024
      # 专用 line_descriptor LSD 参数。
      detectorScale: 2
      detectorNumOctaves: 2

    # FLD 参数，仅 extractor.method: FLD 使用。
    fld:
      lengthThreshold: 10
      distanceThreshold: 1.414213562
      cannyThreshold1: 50.0
      cannyThreshold2: 50.0
      cannyApertureSize: 3
      doMerge: false

association:
  # 可选：LINE_SEGMENT / LINE_DESCRIPTOR / CHAMFER / HAUSDORFF / ICP。
  method: Line_SEGMENT
  params:
    line_descriptor:
      # 线描述子类型，可选：LBD / MSLD / LINE_SIFT。
      descriptor: LBD
      # 匹配器类型，可选：BF / FLANN。FLANN 仅支持 float 描述子。
      matcher: BF
      # 匹配模式，可选：MATCH / KNN / RADIUS。
      match_mode: MATCH
      # KNN 模式保留的近邻数。
      knn_k: 2
      # RADIUS 模式的距离阈值。
      match_radius: 50.0
      # 进入后续阶段所需的最少匹配数。
      min_matches: 2
      # 线匹配几何一致性筛选。
      geometric_filter: true
      angle_threshold_deg: 30.0
      min_length_ratio: 0.30
      shift_consistency_threshold: 30.0
      # MSLD 参数，仅 descriptor: MSLD 使用。
      msld_band_width: 12
      msld_strips: 9
      # line-SIFT 参数，仅 descriptor: LINE_SIFT 使用。
      linesift_band_width: 20
      linesift_strips: 4
      linesift_bands: 4
      linesift_bins: 8

    line_segment:
      angleThresholdDeg: 10.0
      minLengthRatio: 0.60
      maxShiftDistance: 100000.0
      shiftConsistencyThreshold: 20.0
      minMatches: 2
      maxCandidatesPerLine: 5

    chamfer:
      searchRadius: 20
      step: 1
      maxPoints: 2000
      scoreThreshold: 0.25
      bidirectional: true

    hausdorff:
      searchRadius: 30
      step: 2
      maxPoints: 2000
      percentile: 0.95
      scoreThreshold: 3.0
      bidirectional: true

    icp:
      maxIterations: 30
      tolerance: 0.01
      maxPoints: 2000
      minCorrespondences: 20
      maxCorrespondenceDistance: 15.0
      scoreThreshold: 2.0
      initialization: CENTROID

estimation:
  # 结构匹配结果有效性阈值，当前平移模型直接复用关联结果。
  responseThreshold: 0.01