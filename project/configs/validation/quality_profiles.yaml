# 配准质量验证共享参数。
# pipeline 只选择一个 preset，并声明当前方法启用哪些验证器。

shared:
  edge_structure_diagnostic:
    # 前景片段筛选：仅保留足够细长、沿主轴连续的边缘片段，并限制诊断画布大小。
    visibility_threshold: 0
    min_foreground_elongation_ratio: 4.00
    min_axis_occupancy: 0.80
    max_centerline_deviation_ratio: 0.03
    max_canvas_side_pixels: 16384
    max_canvas_pixels: 100000000
    min_fragment_length_pixels: 6.0

    # 线组聚合与直线拟合：按方向和法向距离聚合同一条边的碎片，再剔除不连续或拟合残差过大的线组。
    group_max_angle_difference_degrees: 12.0
    # 初次分组允许的最大法向偏移为 2.0px。
    group_max_normal_distance_pixels: 2.0
    post_fit_group_normal_distance_pixels: 6.0
    min_line_group_actual_length_pixels: 6.0
    min_line_group_continuity_ratio: 0.10
    max_line_group_gap_ratio: 0.45
    max_fragment_direction_spread_degrees: 10.0
    max_line_fit_residual_pixels: 5.0

    # 主方向判定：从有效线组中选出主方向，并约束两个主方向的正交性和支持度。
    min_main_line_actual_length_ratio: 0.30
    direction_cluster_tolerance_degrees: 6.0
    min_main_direction_support_ratio: 0.60
    max_main_direction_spread_degrees: 4.0
    min_main_direction_margin: 0.15
    max_main_direction_difference_degrees: 5.0
    max_axis_classification_error_degrees: 8.0
    min_horizontal_actual_length_ratio: 0.50
    min_vertical_actual_length_ratio: 0.50

    # 重复边与粗边双侧边界处理：合并重复线；粗长边只保留外侧水平边和共同参考系右侧竖直边进入严格匹配。
    duplicate_line_normal_tolerance_pixels: 1.0
    duplicate_line_min_span_overlap_ratio: 0.80
    outer_longitudinal_edge_min_normal_separation_pixels: 1.0
    outer_longitudinal_edge_max_normal_separation_pixels: 12.0
    outer_longitudinal_edge_min_span_overlap_ratio: 0.75
    max_vertical_unmatched_length_ratio: 0.70

    # 线剖面峰值与候选配对：在法向剖面中检测边缘峰值，并以位置、跨度和夹角生成候选线对。
    profile_smoothing_sigma: 1.0
    min_peak_prominence: 0.03
    candidate_position_tolerance_pixels: 15.0
    final_position_tolerance_pixels: 3.0
    candidate_min_span_overlap_ratio: 0.05
    min_shorter_line_overlap_ratio: 0.90
    max_line_pair_angle_difference_degrees: 0.3

    # 全局配对代价：按位置、重叠、夹角和峰值显著性对候选线对排序。
    match_position_cost_weight: 0.45
    match_overlap_cost_weight: 0.30
    match_angle_cost_weight: 0.20
    match_prominence_cost_weight: 0.05

    # 强线与歧义判定：仅使用长度和显著性足够的线；最优与次优候选过接近时标记为歧义。
    min_strong_line_actual_length_pixels: 12.0
    min_strong_peak_prominence: 0.05
    ambiguity_score_margin: 0.05

profiles:
  # 点特征法统一采用 AKAZE 的质量验证标准。
  keypoint:
    warp_overlap:
      min_containment: 0.90
      foreground_threshold: 0
      containment_tolerance_pixels: 0
    height_difference:
      compensate_global_height_offset: true
      percentile: 90
      max_abs_error: 0.15
      local_noise_fallback:
        enabled: true
        p75_max_abs_error: 0.15
        min_containment: 0.90
    match_quality:
      fail_on_violation: true
      min_inliers: 2
      min_inlier_ratio: -1
      max_reproj_error: -1
      min_inlier_spatial_coverage: -1

  # 稠密/稀疏直接法：有离散点对时使用 match_quality。
  direct_match:
    warp_overlap:
      min_containment: 0.90
      foreground_threshold: 5
      containment_tolerance_pixels: 1
    height_difference:
      compensate_global_height_offset: true
      percentile: 90
      max_abs_error: 0.10
    match_quality:
      fail_on_violation: true
      min_inliers: 2
      min_inlier_ratio: -1
      max_reproj_error: -1
      min_inlier_spatial_coverage: -1

  # 频域直接法：使用较低的 confidence 下限 0.01。
  direct_confidence_low:
    warp_overlap:
      min_containment: 0.90
      foreground_threshold: 5
      containment_tolerance_pixels: 1
    height_difference:
      compensate_global_height_offset: true
      percentile: 90
      max_abs_error: 0.10
    direct_quality:
      fail_on_violation: true
      min_confidence: 0.01

  # 全局直接法：使用较高的 confidence 下限 0.85。
  direct_confidence_high:
    warp_overlap:
      min_containment: 0.90
      foreground_threshold: 5
      containment_tolerance_pixels: 1
    height_difference:
      compensate_global_height_offset: true
      percentile: 90
      max_abs_error: 0.10
    direct_quality:
      fail_on_violation: true
      min_confidence: 0.85

  # 学习法通用质量验证参数。
  learning:
    warp_overlap:
      min_containment: 0.90
      foreground_threshold: 5
      containment_tolerance_pixels: 1
    height_difference:
      compensate_global_height_offset: true
      percentile: 90
      max_abs_error: 0.10

  # 直线结构法质量验证参数；共享块中的 edge_structure_diagnostic 仅由结构 pipeline 启用。
  structure_line:
    warp_overlap:
      min_containment: 0.90
      foreground_threshold: 5
      containment_tolerance_pixels: 1
    structure_overlap:
      min_iou: 0.12
      foreground_threshold: 0
      dilate_size: 7
    height_difference:
      compensate_global_height_offset: true
      percentile: 90
      max_abs_error: 0.10

  # 轮廓结构法质量验证参数；共享块中的 edge_structure_diagnostic 仅由结构 pipeline 启用。
  structure_contour:
    warp_overlap:
      min_containment: 0.90
      foreground_threshold: 5
      containment_tolerance_pixels: 1
    structure_overlap:
      min_iou: 0.12
      foreground_threshold: 0
      dilate_size: 7
    height_difference:
      compensate_global_height_offset: true
      percentile: 90
      max_abs_error: 0.10
    method_quality:
      fail_on_violation: true
      min_structures: 1
      min_structure_matches: 1
